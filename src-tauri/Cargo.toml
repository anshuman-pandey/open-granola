[package]
name = "open-granola"
default-run = "open-granola"
version = "0.1.0"
description = "Open Granola — local meeting notes and on-device inference."
authors = ["Open Granola contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[lib]
name = "open_granola_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- app framework ---
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"

# --- microphone capture ---
cpal = "0.15"
rubato = "0.16"          # resampling to 16 kHz mono for whisper
ringbuf = "0.5.2"

# --- on-device inference ---
whisper-rs = { version = "0.16", default-features = false }   # whisper.cpp bindings
# Inference reads local files; the app does not download models.

# --- local storage ---
rusqlite = { version = "0.40.2", features = ["bundled"] }

# --- misc ---
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[features]
default = []
# Explicit accelerator opt-ins keep CPU builds portable.
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[workspace]
members = ["inference-worker"]
default-members = [".", "inference-worker"]
resolver = "2"
