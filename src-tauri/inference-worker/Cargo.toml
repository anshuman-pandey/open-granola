[package]
name = "open-granola-inference"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
llama-cpp-2 = { version = "=0.1.157", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
