name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libclang-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run build:worker
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --workspace

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  macos-preview:
    needs: [frontend, rust, rust-audit]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: preview-aarch64
      - run: npm ci
      - name: Build Apple Silicon preview
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg
      - name: Test signing entitlement inspection
        run: node --test scripts/macos-entitlements.test.mjs
      - name: Verify bundle and prepare checksums
        env:
          OPEN_GRANOLA_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/package-macos-preview.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: open-granola-macos-arm64-preview-${{ github.sha }}
          path: artifacts/macos-preview/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [frontend, rust, rust-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libclang-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build draft release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Open Granola ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Development preview: microphone-only recording with manually installed Whisper models.
            These bundles require install, permission, recording and recovery validation on real hardware.
            See docs/RELEASING.md for signing and validation requirements before publishing.
