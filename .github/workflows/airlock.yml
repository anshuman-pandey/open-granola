name: Privacy boundaries

on: [push, pull_request]
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify CSP, capabilities, remote assets and first-party network policy
        run: node scripts/check-security.mjs
      - name: Test the policy checker against unsafe configurations
        run: node --test scripts/check-security.test.mjs
