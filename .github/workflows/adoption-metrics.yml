name: Adoption metrics

on:
  schedule:
    # Daily at 09:00 Asia/Kolkata. Research/engineering is a separate Codex loop.
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/adoption-snapshot*.mjs
      - .github/workflows/adoption-metrics.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/adoption-snapshot.test.mjs
      - name: Collect public aggregate counters
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adoption-snapshot.mjs --repo anshuman-pandey/open-granola --output adoption-snapshot.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: adoption-snapshot-${{ github.run_id }}
          path: adoption-snapshot.json
          retention-days: 90
          if-no-files-found: error
