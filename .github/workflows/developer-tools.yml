name: Developer tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript-tools:
    name: Transcript tools (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # This deliberately exercises the advertised path without npm ci or Rust.
      - run: node --test scripts/notes.test.mjs
      - run: node scripts/notes.mjs validate examples/transcripts/standup.og.json
